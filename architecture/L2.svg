<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="424" viewBox="0 0 1180 424" font-family="Helvetica Neue, Arial, sans-serif"><metadata>© Sun Jia-Rong · Independent research · 2026-10-21 | jiarong0423@gmail.com</metadata>
<rect width="1180" height="424" fill="#ffffff"/>
<text x="24" y="40" font-size="26" font-weight="700" fill="#222">L2  Data and reference tables</text>
<text x="24" y="68" font-size="16" fill="#444">Turn the collected official station data into comparable tables</text>
<rect x="24" y="96" width="560" height="122" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="124" font-size="19" font-weight="700" fill="#222">Calendar table</text>
<text x="38" y="156" font-size="16" fill="#333">Official calendar day types (weekends, public holidays, make-up days);</text>
<text x="38" y="180" font-size="16" fill="#333">special-event days are marked and excluded</text>
<text x="38" y="204" font-size="15" fill="#5b6f8a">Trigger: Daily</text>
<rect x="604" y="96" width="560" height="122" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="618" y="124" font-size="19" font-weight="700" fill="#222">Station usual-level base table</text>
<text x="618" y="156" font-size="16" fill="#333">Median docked level per station, per window, per day type; used as each</text>
<text x="618" y="180" font-size="16" fill="#333">station&#x27;s target</text>
<text x="618" y="204" font-size="15" fill="#5b6f8a">Trigger: Daily</text>
<rect x="24" y="238" width="560" height="122" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="266" font-size="19" font-weight="700" fill="#222">Stations and 2 km circles</text>
<text x="38" y="298" font-size="16" fill="#333">A station within 2,000 m of a circle centre belongs to that circle; circles may</text>
<text x="38" y="322" font-size="16" fill="#333">overlap; 96 circles (72 main plus island groups)</text>
<text x="38" y="346" font-size="15" fill="#5b6f8a">Trigger: On station changes</text>
<rect x="604" y="238" width="560" height="122" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="618" y="266" font-size="19" font-weight="700" fill="#222">New-station placement</text>
<text x="618" y="298" font-size="16" fill="#333">New stations are assigned to existing circles automatically; circle centres</text>
<text x="618" y="322" font-size="16" fill="#333">do not move</text>
<text x="618" y="346" font-size="15" fill="#5b6f8a">Trigger: Daily</text>
<text x="24" y="410" font-size="13" fill="#777">Architecture sketch (public, simplified) | Algorithmic replay, not operating results</text>
<g opacity="0.08" transform="rotate(-20 590 212)"><text x="590" y="222" text-anchor="middle" font-size="28" font-weight="bold" fill="#0b3a63" font-family="Helvetica Neue, Arial, sans-serif">© Sun Jia-Rong · Independent research · 2026-10-21</text></g>
</svg>
