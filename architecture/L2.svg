<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="408" viewBox="0 0 1180 408" font-family="Helvetica Neue, Arial, sans-serif"><metadata>© Sun Jia-Rong · Independent research · 2026-10-21 | jiarong0423@gmail.com</metadata>
<rect width="1180" height="408" fill="#ffffff"/>
<text x="24" y="40" font-size="26" font-weight="700" fill="#222">L2  Data and reference tables</text>
<text x="24" y="68" font-size="15" fill="#444">Turn the collected official station data into comparable tables</text>
<rect x="24" y="96" width="560" height="114" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="124" font-size="17" font-weight="700" fill="#222">Calendar table</text>
<text x="38" y="153" font-size="14" fill="#333">Official calendar day types (weekends, public holidays, make-up days);</text>
<text x="38" y="174" font-size="14" fill="#333">special-event days are marked and excluded</text>
<text x="38" y="198" font-size="13" fill="#5b6f8a">Trigger: Daily</text>
<rect x="604" y="96" width="560" height="114" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="618" y="124" font-size="17" font-weight="700" fill="#222">Station usual-level base table</text>
<text x="618" y="153" font-size="14" fill="#333">Median docked level per station, per window, per day type; used as each station&#x27;s</text>
<text x="618" y="174" font-size="14" fill="#333">target</text>
<text x="618" y="198" font-size="13" fill="#5b6f8a">Trigger: Daily</text>
<rect x="24" y="230" width="560" height="114" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="258" font-size="17" font-weight="700" fill="#222">Stations and 2 km circles</text>
<text x="38" y="287" font-size="14" fill="#333">A station within 2,000 m of a circle centre belongs to that circle; circles may overlap;</text>
<text x="38" y="308" font-size="14" fill="#333">96 circles (72 main plus island groups)</text>
<text x="38" y="332" font-size="13" fill="#5b6f8a">Trigger: On station changes</text>
<rect x="604" y="230" width="560" height="114" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="618" y="258" font-size="17" font-weight="700" fill="#222">New-station placement</text>
<text x="618" y="287" font-size="14" fill="#333">New stations are assigned to existing circles automatically; circle centres do not</text>
<text x="618" y="308" font-size="14" fill="#333">move</text>
<text x="618" y="332" font-size="13" fill="#5b6f8a">Trigger: Daily</text>
<text x="24" y="394" font-size="12" fill="#777">Architecture sketch (public, simplified) | Algorithmic replay, not operating results</text>
