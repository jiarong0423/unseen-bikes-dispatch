<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1092" viewBox="0 0 1180 1092" font-family="PingFang TC, Noto Sans TC, sans-serif"><metadata>© 孫嘉嶸　獨立研究　2026-10-21｜jiarong0423@gmail.com</metadata>
<rect width="1180" height="1092" fill="#ffffff"/>
<text x="24" y="40" font-size="26" font-weight="700" fill="#222">派工邏輯解耦圖</text>
<text x="24" y="68" font-size="15" fill="#444">六層，每層只依賴上一層交出的東西；箭頭寫「傳什麼給下一層」</text>
<rect x="24" y="96" width="1132" height="137" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="124" font-size="17" font-weight="700" fill="#222">① 資料層<tspan font-size="14" font-weight="400" fill="#5b6f8a">　官方看得到的 vs 看不到的</tspan></text>
<text x="38" y="159" font-size="14" fill="#333">• 官方站況快照：每站可借、空位，每 5／15／30 分一筆；只看得到柱上的車，看不到柱外車</text>
<text x="38" y="180" font-size="14" fill="#333">• 柱外車量：自行從官方資料推估的上界 4,262 台（情境假設，不是實測）</text>
<text x="38" y="201" font-size="14" fill="#333">• 自然還車：每站每 10 分鐘的歷史還車，平日與假日分開</text>
<text x="44" y="257" font-size="14" fill="#5b6f8a">↓　交出：每站實際柱上車數、柱數、推估備用車</text>
<rect x="24" y="271" width="1132" height="116" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="299" font-size="17" font-weight="700" fill="#222">② 幾何層<tspan font-size="14" font-weight="400" fill="#5b6f8a">　兩公里圈</tspan></text>
<text x="38" y="334" font-size="14" fill="#333">• 圈心 2,000 公尺內的站屬於該圈，圈可重疊；站屬多圈時，車與柱均分</text>
<text x="38" y="355" font-size="14" fill="#333">• 共 96 圈：主要 72 圈加孤島群；孤島群各自用自己的備用車，不併進主要圈</text>
<text x="44" y="411" font-size="14" fill="#5b6f8a">↓　交出：每圈的站集合、均分後的車與柱</text>
<rect x="24" y="425" width="1132" height="137" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="453" font-size="17" font-weight="700" fill="#222">③ 區域水位層（貨車：兩公里區域內水位平衡）<tspan font-size="14" font-weight="400" fill="#5b6f8a">　只搬總量，不回應個別事件</tspan></text>
<text x="38" y="488" font-size="14" fill="#333">• 目標＝每站自己平常的水位 × 柱數；缺口＝目標減現況（柱上加推估備用車）</text>
<text x="38" y="509" font-size="14" fill="#333">• 兩公里內能直接調度的先調，其餘靠備用車上樁；扣掉後仍缺的量＝真實缺車</text>
<text x="38" y="530" font-size="14" fill="#333">• 四個窗口 05:30、10:00、15:30、23:00；離峰預置，尖峰不出車；每 30 分鐘算一批並記錄</text>
<text x="44" y="586" font-size="14" fill="#5b6f8a">↓　交出：每圈缺口、2 km 內調度量、真實缺車</text>
<rect x="24" y="600" width="1132" height="116" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="628" font-size="17" font-weight="700" fill="#222">④ 順向排線層<tspan font-size="14" font-weight="400" fill="#5b6f8a">　把圈到圈的調度排成路線</tspan></text>
<text x="38" y="663" font-size="14" fill="#333">• 載量 14；每段不超過 2 公里；不折返（各段方向在同一個 120° 扇形內）</text>
<text x="38" y="684" font-size="14" fill="#333">• 從調度場出發，時速 40、迂迴 1.3（假設）；算出要派幾台貨車與最晚出發時間</text>
<text x="44" y="740" font-size="14" fill="#5b6f8a">↓　交出：順向路線、貨車數、最晚出發</text>
<rect x="24" y="754" width="1132" height="116" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="782" font-size="17" font-weight="700" fill="#222">⑤ 站級層（機車，尖峰）<tspan font-size="14" font-weight="400" fill="#5b6f8a">　只換層，不搬總量</tspan></text>
<text x="38" y="817" font-size="14" fill="#333">• 把站上柱外的車解綁上樁，總數不變，不需要移動車輛</text>
<text x="38" y="838" font-size="14" fill="#333">• 站級的缺口清單依各站目標與現況排序</text>
<text x="44" y="894" font-size="14" fill="#5b6f8a">↓　交出：站級的實際與目標</text>
<rect x="24" y="908" width="1132" height="116" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="936" font-size="17" font-weight="700" fill="#222">⑥ 量測層<tspan font-size="14" font-weight="400" fill="#5b6f8a">　回放推演，不是營運成效</tspan></text>
<text x="38" y="971" font-size="14" fill="#333">• 補完仍缺、貨車數、敏感度表；沒有反事實對照，限制寫在每一頁</text>
<text x="38" y="992" font-size="14" fill="#333">• 每一頁都寫明假設與限制</text>
<text x="44" y="1048" font-size="14" fill="#5b6f8a">→　輸出：簡報與報表</text>
<text x="24" y="1078" font-size="12" fill="#777">架構示意（公開版，已簡化）｜演算法推演，不是營運成效</text>
<g opacity="0.08" transform="rotate(-20 590 546)"><text x="590" y="569" text-anchor="middle" font-size="65" font-weight="bold" fill="#0b3a63" font-family="PingFang TC, Noto Sans TC, sans-serif">© 孫嘉嶸　獨立研究　2026-10-21</text></g>
</svg>
