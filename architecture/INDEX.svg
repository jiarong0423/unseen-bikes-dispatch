<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="818" viewBox="0 0 1180 818" font-family="Helvetica Neue, Arial, sans-serif"><metadata>© Sun Jia-Rong · Independent research · 2026-10-21 | jiarong0423@gmail.com</metadata>
<rect width="1180" height="818" fill="#ffffff"/>
<text x="24" y="40" font-size="26" font-weight="700" fill="#222">Layered architecture overview</text>
<text x="24" y="68" font-size="15" fill="#444">Eight layers. Solid box = diagram in this repo; dashed box = name only, details not published. L6 and L7 cut across the others.</text>
<rect x="24" y="96" width="900" height="68" rx="8" fill="#fafafa" stroke="#5b6f8a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="42" y="124" font-size="19" font-weight="700" fill="#222">L1  Collection</text>
<text x="42" y="150" font-size="16" fill="#444">Bring in official station data, weather and notices</text>
<text x="906" y="136" text-anchor="end" font-size="16" fill="#5b6f8a">details not published</text>
<rect x="24" y="180" width="900" height="68" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="208" font-size="19" font-weight="700" fill="#222">L2  Data and reference tables</text>
<text x="42" y="234" font-size="16" fill="#444">Turn collected data into comparable tables</text>
<text x="906" y="220" text-anchor="end" font-size="16" fill="#5b6f8a">see the layer diagram</text>
<rect x="24" y="264" width="900" height="68" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="292" font-size="19" font-weight="700" fill="#222">L3  Definitions</text>
<text x="42" y="318" font-size="16" fill="#444">Definitions of numbers and terms</text>
<text x="906" y="304" text-anchor="end" font-size="16" fill="#5b6f8a">see the layer diagram</text>
<rect x="24" y="348" width="900" height="68" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="376" font-size="19" font-weight="700" fill="#222">L4  Dispatch algorithm</text>
<text x="42" y="402" font-size="16" fill="#444">2 km circle level balance, forward routes, number of trucks</text>
<text x="906" y="388" text-anchor="end" font-size="16" fill="#5b6f8a">see the layer diagram</text>
<rect x="24" y="432" width="900" height="68" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="460" font-size="19" font-weight="700" fill="#222">L5  Observation and reports</text>
<text x="42" y="486" font-size="16" fill="#444">Summarise each batch into comparable observations</text>
<text x="906" y="472" text-anchor="end" font-size="16" fill="#5b6f8a">see the layer diagram</text>
<rect x="24" y="516" width="900" height="68" rx="8" fill="#fafafa" stroke="#5b6f8a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="42" y="544" font-size="19" font-weight="700" fill="#222">L6  Governance</text>
<text x="42" y="570" font-size="16" fill="#444">Process gates and quality checks</text>
<text x="906" y="556" text-anchor="end" font-size="16" fill="#5b6f8a">details not published</text>
<rect x="24" y="600" width="900" height="68" rx="8" fill="#fafafa" stroke="#5b6f8a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="42" y="628" font-size="19" font-weight="700" fill="#222">L7  Off-dock reporting</text>
