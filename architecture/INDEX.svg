<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="770" viewBox="0 0 1180 770" font-family="PingFang TC, Noto Sans TC, sans-serif"><metadata>© 孫嘉嶸　獨立研究　2026-10-21｜jiarong0423@gmail.com</metadata>
<rect width="1180" height="770" fill="#ffffff"/>
<text x="24" y="40" font-size="26" font-weight="700" fill="#222">分層架構總覽</text>
<text x="24" y="68" font-size="15" fill="#444">八層：實線框＝本 repo 有圖；虛線框＝只列名稱，細節不公開。L6 治理與 L7 回報橫跨各層，不是資料流的一站</text>
<rect x="24" y="96" width="900" height="62" rx="8" fill="#fafafa" stroke="#5b6f8a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="42" y="122" font-size="17" font-weight="700" fill="#222">L1　採集</text>
<text x="42" y="144" font-size="14" fill="#444">把官方站況、天氣、公告收進來</text>
<text x="906" y="132" text-anchor="end" font-size="14" fill="#5b6f8a">細節不公開</text>
<rect x="24" y="174" width="900" height="62" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="200" font-size="17" font-weight="700" fill="#222">L2　資料與對照表</text>
<text x="42" y="222" font-size="14" fill="#444">把收進來的東西變成可比對的表</text>
<text x="906" y="210" text-anchor="end" font-size="14" fill="#5b6f8a">見各層圖</text>
<rect x="24" y="252" width="900" height="62" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="278" font-size="17" font-weight="700" fill="#222">L3　口徑</text>
<text x="42" y="300" font-size="14" fill="#444">數字與詞的定義</text>
<text x="906" y="288" text-anchor="end" font-size="14" fill="#5b6f8a">見各層圖</text>
<rect x="24" y="330" width="900" height="62" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="356" font-size="17" font-weight="700" fill="#222">L4　派工演算法</text>
<text x="42" y="378" font-size="14" fill="#444">兩公里區域內的水位平衡、順向路線、貨車數</text>
<text x="906" y="366" text-anchor="end" font-size="14" fill="#5b6f8a">見各層圖</text>
<rect x="24" y="408" width="900" height="62" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="434" font-size="17" font-weight="700" fill="#222">L5　觀察與報表</text>
<text x="42" y="456" font-size="14" fill="#444">把每批結果彙整成可對照的觀察</text>
<text x="906" y="444" text-anchor="end" font-size="14" fill="#5b6f8a">見各層圖</text>
<rect x="24" y="486" width="900" height="62" rx="8" fill="#fafafa" stroke="#5b6f8a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="42" y="512" font-size="17" font-weight="700" fill="#222">L6　治理</text>
<text x="42" y="534" font-size="14" fill="#444">流程守門與品質檢查</text>
<text x="906" y="522" text-anchor="end" font-size="14" fill="#5b6f8a">細節不公開</text>
<rect x="24" y="564" width="900" height="62" rx="8" fill="#fafafa" stroke="#5b6f8a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="42" y="590" font-size="17" font-weight="700" fill="#222">L7　隱藏層回報</text>
<text x="42" y="612" font-size="14" fill="#444">柱外車的回報（藍牙或人工）</text>
<text x="906" y="600" text-anchor="end" font-size="14" fill="#5b6f8a">細節不公開</text>
<rect x="24" y="642" width="900" height="62" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="668" font-size="17" font-weight="700" fill="#222">L8　呈現</text>
<text x="42" y="690" font-size="14" fill="#444">給調度員看的畫面</text>
<text x="906" y="678" text-anchor="end" font-size="14" fill="#5b6f8a">見各層圖</text>
<text x="24" y="756" font-size="12" fill="#777">架構示意（公開版，已簡化）｜演算法推演，不是營運成效</text>
<g opacity="0.08" transform="rotate(-20 590 385)"><text x="590" y="408" text-anchor="middle" font-size="65" font-weight="bold" fill="#0b3a63" font-family="PingFang TC, Noto Sans TC, sans-serif">© 孫嘉嶸　獨立研究　2026-10-21</text></g>
</svg>
