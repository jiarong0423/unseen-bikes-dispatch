<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="770" viewBox="0 0 1180 770" font-family="Helvetica Neue, Arial, sans-serif"><metadata>© Sun Jia-Rong · Independent research · 2026-10-21 | jiarong0423@gmail.com</metadata>
<rect width="1180" height="770" fill="#ffffff"/>
<text x="24" y="40" font-size="26" font-weight="700" fill="#222">Layered architecture overview</text>
<text x="24" y="68" font-size="15" fill="#444">Eight layers. Solid box = diagram in this repo; dashed box = name only, details not published. L6 and L7 cut across the others.</text>
<rect x="24" y="96" width="900" height="62" rx="8" fill="#fafafa" stroke="#5b6f8a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="42" y="122" font-size="17" font-weight="700" fill="#222">L1  Collection</text>
<text x="42" y="144" font-size="14" fill="#444">Bring in official station data, weather and notices</text>
<text x="906" y="132" text-anchor="end" font-size="14" fill="#5b6f8a">details not published</text>
<rect x="24" y="174" width="900" height="62" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="200" font-size="17" font-weight="700" fill="#222">L2  Data and reference tables</text>
<text x="42" y="222" font-size="14" fill="#444">Turn collected data into comparable tables</text>
<text x="906" y="210" text-anchor="end" font-size="14" fill="#5b6f8a">see the layer diagram</text>
<rect x="24" y="252" width="900" height="62" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="278" font-size="17" font-weight="700" fill="#222">L3  Definitions</text>
<text x="42" y="300" font-size="14" fill="#444">Definitions of numbers and terms</text>
<text x="906" y="288" text-anchor="end" font-size="14" fill="#5b6f8a">see the layer diagram</text>
<rect x="24" y="330" width="900" height="62" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="356" font-size="17" font-weight="700" fill="#222">L4  Dispatch algorithm</text>
<text x="42" y="378" font-size="14" fill="#444">2 km regional level balance, forward routes, number of trucks</text>
<text x="906" y="366" text-anchor="end" font-size="14" fill="#5b6f8a">see the layer diagram</text>
<rect x="24" y="408" width="900" height="62" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="434" font-size="17" font-weight="700" fill="#222">L5  Observation and reports</text>
<text x="42" y="456" font-size="14" fill="#444">Summarise each batch into comparable observations</text>
<text x="906" y="444" text-anchor="end" font-size="14" fill="#5b6f8a">see the layer diagram</text>
<rect x="24" y="486" width="900" height="62" rx="8" fill="#fafafa" stroke="#5b6f8a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="42" y="512" font-size="17" font-weight="700" fill="#222">L6  Governance</text>
<text x="42" y="534" font-size="14" fill="#444">Process gates and quality checks</text>
<text x="906" y="522" text-anchor="end" font-size="14" fill="#5b6f8a">details not published</text>
<rect x="24" y="564" width="900" height="62" rx="8" fill="#fafafa" stroke="#5b6f8a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="42" y="590" font-size="17" font-weight="700" fill="#222">L7  Off-dock reporting</text>
<text x="42" y="612" font-size="14" fill="#444">Reports of off-dock bikes (Bluetooth or manual)</text>
<text x="906" y="600" text-anchor="end" font-size="14" fill="#5b6f8a">details not published</text>
<rect x="24" y="642" width="900" height="62" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="42" y="668" font-size="17" font-weight="700" fill="#222">L8  Presentation</text>
<text x="42" y="690" font-size="14" fill="#444">The screens a dispatcher looks at</text>
<text x="906" y="678" text-anchor="end" font-size="14" fill="#5b6f8a">see the layer diagram</text>
<text x="24" y="756" font-size="12" fill="#777">Architecture sketch (public, simplified) | Algorithmic replay, not operating results</text>
