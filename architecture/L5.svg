<rect width="1180" height="366" fill="#ffffff"/>
<text x="24" y="40" font-size="26" font-weight="700" fill="#222">L5　觀察與報表</text>
<text x="24" y="68" font-size="15" fill="#444">把每批結果彙整成可對照的觀察；只觀察，不改目標</text>
<rect x="24" y="96" width="560" height="93" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="124" font-size="17" font-weight="700" fill="#222">每日紀錄</text>
<text x="38" y="153" font-size="14" fill="#333">每天彙整一份當日各批結果</text>
<text x="38" y="177" font-size="13" fill="#5b6f8a">觸發：每天一次</text>
<rect x="604" y="96" width="560" height="93" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="618" y="124" font-size="17" font-weight="700" fill="#222">自然還車（逐 10 分鐘）</text>
<text x="618" y="153" font-size="14" fill="#333">每站每 10 分鐘的歷史自然還車，平日與假日分開</text>
<text x="618" y="177" font-size="13" fill="#5b6f8a">觸發：每天一次</text>
<rect x="24" y="209" width="560" height="93" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="237" font-size="17" font-weight="700" fill="#222">每日水位觀察</text>
<text x="38" y="266" font-size="14" fill="#333">新舊口徑並排，看每天的偏離</text>
<text x="38" y="290" font-size="13" fill="#5b6f8a">觸發：每天一次</text>
<text x="24" y="352" font-size="12" fill="#777">架構示意（公開版，已簡化）｜演算法推演，不是營運成效</text>
