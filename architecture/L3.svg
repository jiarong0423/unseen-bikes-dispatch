<text x="618" y="124" font-size="19" font-weight="700" fill="#222">Assumed parameters</text>
<text x="618" y="156" font-size="16" fill="#333">Truck capacity 14, speed 40 km/h, detour factor 1.3 and similar</text>
<text x="618" y="180" font-size="16" fill="#333">assumptions are kept in one place</text>
<text x="618" y="204" font-size="15" fill="#5b6f8a">Trigger: Maintained by hand</text>
<rect x="24" y="238" width="560" height="98" rx="8" fill="#f2f5f9" stroke="#5b6f8a" stroke-width="2"/>
<text x="38" y="266" font-size="19" font-weight="700" fill="#222">Service-day boundary</text>
<text x="38" y="298" font-size="16" fill="#333">00:00-05:30 counts as the previous day; the day changes at 05:30</text>
<text x="38" y="322" font-size="15" fill="#5b6f8a">Trigger: Maintained by hand</text>
