<text x="38" y="124" font-size="19" font-weight="700" fill="#222">Level definition</text>
<text x="38" y="156" font-size="16" fill="#333">Docked bikes and estimated off-dock (reserve) bikes are defined as two</text>
<text x="38" y="180" font-size="16" fill="#333">separate layers and never mixed</text>
<text x="38" y="204" font-size="15" fill="#5b6f8a">Trigger: Maintained by hand</text>
